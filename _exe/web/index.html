<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PaintSoft</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">PaintSoft</div>

      <div class="controls">
        <label class="control">
          <span>色</span>
          <input id="color" type="color" value="#111111" />
        </label>

        <label class="control">
          <span>背景</span>
          <input id="bgColor" type="color" value="#ffffff" />
        </label>

        <div class="control buttons">
          <button id="clear" type="button">クリア</button>
          <button id="save" type="button">PNG保存</button>
        </div>

        <div class="control buttons">
          <button id="saveProject" type="button" title="レイヤー構成を保持したまま保存（本アプリ専用形式）">プロジェクト保存</button>
          <button id="openProject" type="button" title="プロジェクト保存で書き出した .psft ファイルを開く">プロジェクトを開く</button>
          <input id="openProjectInput" type="file" accept=".psft,application/json" hidden />
          <button id="closeProject" type="button" title="現在のプロジェクトを閉じて新規作成します（未保存の変更は失われます）">プロジェクトを閉じる</button>
          <button id="savePsd" type="button" title="レイヤーを維持したままPSD形式で書き出し（簡易再現・非公式）">PSD書き出し</button>
        </div>

        <div class="control buttons">
          <button id="nodeAdd" type="button" title="レイヤーを追加">＋レイヤー</button>
          <button id="folderAdd" type="button" title="フォルダを追加">📁＋フォルダ</button>
          <button id="nodeDel" type="button" title="選択中のレイヤーを削除">－レイヤー削除</button>
        </div>

        <div class="control buttons">
          <button id="openCanvasSettings" type="button" title="キャンバスのサイズ・解像度を変更">キャンバス設定</button>
          <button id="openGlobalSettings" type="button" title="手ブレ補正・筆圧補正・ショートカットなど、全体設定を変更">グローバル設定</button>
          <button id="resetView" type="button" title="表示位置・ズームを初期状態に戻す（Ctrl+0）">表示リセット</button>
        </div>
      </div>
    </header>

    <main class="stage">
      <div id="workspace" class="workspace">
        <div id="canvasPanel" class="canvasWrap panel" role="application" aria-label="お絵かきキャンバス">
          <div id="canvasHandle" class="panelHandle" title="ドラッグで移動">キャンバス</div>
          <canvas id="canvas"></canvas>
          <canvas id="canvasScreen" aria-hidden="true"></canvas>
          <div id="hint" class="hint">ドラッグして描画 / Ctrl+Zで戻す / Ctrl+Yでやり直し</div>
          <div id="canvasResize" class="resizeHandle" title="ドラッグでサイズ変更（縦横比を維持）"></div>
        </div>

        <aside id="nodePanel" class="nodePanel panel" aria-label="レイヤーノード">
          <div id="nodeHandle" class="nodeHeader" title="ドラッグで移動">
            <div class="nodeTitle">ノード</div>
          </div>

          <div id="nodeHelp" class="nodeHelp">
            レイヤー（ノード）を選択して描画。<br />
            ノードの「出力」→出力ノードの「入力」に接続すると合成されます。<br />
            出力ノードに近いほど上（手前）になります。
          </div>

          <div id="nodeEditor" class="nodeEditor" role="application" aria-label="ノードエディタ">
            <svg id="nodeLinks" class="nodeLinks" aria-hidden="true"></svg>
            <div id="nodeNodes" class="nodeNodes"></div>
          </div>
          <div id="nodeResize" class="resizeHandle" title="ドラッグでサイズ変更"></div>
          <div id="nodeResizeTop" class="resizeEdge top" title="ドラッグでサイズ変更"></div>
          <div id="nodeResizeRight" class="resizeEdge right" title="ドラッグでサイズ変更"></div>
          <div id="nodeResizeBottom" class="resizeEdge bottom" title="ドラッグでサイズ変更"></div>
          <div id="nodeResizeLeft" class="resizeEdge left" title="ドラッグでサイズ変更"></div>
        </aside>
      </div>

      <aside id="brushPanel" class="brushPanel" aria-label="ブラシ設定">
        <div class="brushPanelTitle">ブラシ設定</div>

        <div class="brushPresetPanel">
          <div class="brushPresetHeader">
            <span>ブラシ</span>
            <div class="brushPresetActions">
              <button id="brushPresetSave" type="button" title="現在の設定を新しいブラシとして追加">＋</button>
              <button id="brushPresetUpdate" type="button" title="選択中のブラシを現在の設定で上書き">💾</button>
              <button id="brushPresetDelete" type="button" title="選択中のブラシを削除">－</button>
            </div>
          </div>
          <div id="brushPresetList" class="brushPresetList">
            <div class="brushPresetEmpty">（保存されたブラシはありません）</div>
          </div>
        </div>

        <div class="brushPanelSectionTitle">現在の設定</div>

        <label class="control vertical">
          <span>太さ</span>
          <div class="controlRow">
            <input id="size" type="range" min="1" max="64" value="8" />
            <span id="sizeValue" class="mono">8</span>
          </div>

          <div class="controlSubOption pressureRangeGroup">
            <div class="pressureRangeHeader">
              <span>筆圧レンジ（太さに対する割合）</span>
              <label class="pressureRangeToggle">
                <input id="sizePressureEnabled" type="checkbox" checked />
                <span>筆圧を適用</span>
              </label>
            </div>
            <div class="controlRow">
              <span class="rangeLabel">最小</span>
              <input id="sizeMin" type="range" min="0" max="200" value="10" />
              <span id="sizeMinValue" class="mono">10%</span>
            </div>
            <div class="controlRow">
              <span class="rangeLabel">最大</span>
              <input id="sizeMax" type="range" min="0" max="100" value="100" />
              <span id="sizeMaxValue" class="mono">100%</span>
            </div>
          </div>
        </label>

        <label class="control vertical">
          <span>不透明度</span>
          <div class="controlRow">
            <input id="opacity" type="range" min="0" max="100" value="100" />
            <span id="opacityValue" class="mono">100%</span>
          </div>

          <div class="controlSubOption pressureRangeGroup">
            <div class="pressureRangeHeader">
              <span>筆圧レンジ（不透明度に対する割合）</span>
              <label class="pressureRangeToggle">
                <input id="opacityPressureEnabled" type="checkbox" checked />
                <span>筆圧を適用</span>
              </label>
            </div>
            <div class="controlRow">
              <span class="rangeLabel">最小</span>
              <input id="opacityMin" type="range" min="0" max="100" value="0" />
              <span id="opacityMinValue" class="mono">0%</span>
            </div>
            <div class="controlRow">
              <span class="rangeLabel">最大</span>
              <input id="opacityMax" type="range" min="0" max="100" value="100" />
              <span id="opacityMaxValue" class="mono">100%</span>
            </div>
          </div>
        </label>

        <label class="control vertical">
          <span>ツール</span>
          <select id="tool">
            <option value="brush" selected>ブラシ</option>
            <option value="eraser">消しゴム</option>
          </select>
        </label>

        <label class="control vertical">
          <span>ぼかし（ペン先のアンチエイリアス。0で二値・輪郭くっきり／高いほどエアブラシのようににじむ）</span>
          <div class="controlRow">
            <input id="blur" type="range" min="0" max="100" value="0" />
            <span id="blurValue" class="mono">0</span>
          </div>
        </label>

        <label class="control vertical">
          <span>間隔</span>
          <div class="controlRow">
            <input id="spacing" type="range" min="1" max="100" value="15" />
            <span id="spacingValue" class="mono">15%</span>
          </div>
        </label>

        <div class="control buttons vertical">
          <button id="eyedropper" type="button" aria-pressed="false">スポイト</button>
          <button id="bucket" type="button" aria-pressed="false">バケツ</button>
        </div>
      </aside>
    </main>

    <dialog id="canvasSettingsDialog" class="appDialog">
      <div class="dialogHead">
        <h2>キャンバス設定</h2>
        <button id="canvasSettingsClose" type="button" class="dialogCloseBtn" title="閉じる" aria-label="閉じる">×</button>
      </div>

      <div class="dialogTabs">
        <button id="canvasModeResize" type="button" class="dialogTab" aria-pressed="true">解像度変更（リサイズ）</button>
        <button id="canvasModeCrop" type="button" class="dialogTab" aria-pressed="false">キャンバスサイズ変更（切り抜き/拡張）</button>
      </div>

      <p id="canvasModeHint" class="dialogHint">絵の内容を新しいサイズに合わせて拡大縮小します。</p>

      <label class="control vertical">
        <span>幅 (px)</span>
        <input id="canvasWidthInput" type="number" min="1" max="8000" />
      </label>

      <label class="control vertical">
        <span>高さ (px)</span>
        <input id="canvasHeightInput" type="number" min="1" max="8000" />
      </label>

      <label class="control" id="lockAspectRow">
        <input id="lockAspectInput" type="checkbox" checked />
        <span>アスペクト比を固定</span>
      </label>

      <div id="anchorGridWrap" class="anchorGridWrap" hidden>
        <span>基準位置（既存の絵を固定する位置）</span>
        <div id="anchorGrid" class="anchorGrid">
          <button type="button" class="anchorCell" data-x="0" data-y="0" title="左上"></button>
          <button type="button" class="anchorCell" data-x="0.5" data-y="0" title="上"></button>
          <button type="button" class="anchorCell" data-x="1" data-y="0" title="右上"></button>
          <button type="button" class="anchorCell" data-x="0" data-y="0.5" title="左"></button>
          <button type="button" class="anchorCell active" data-x="0.5" data-y="0.5" title="中央"></button>
          <button type="button" class="anchorCell" data-x="1" data-y="0.5" title="右"></button>
          <button type="button" class="anchorCell" data-x="0" data-y="1" title="左下"></button>
          <button type="button" class="anchorCell" data-x="0.5" data-y="1" title="下"></button>
          <button type="button" class="anchorCell" data-x="1" data-y="1" title="右下"></button>
        </div>
      </div>

      <div class="dialogFooter">
        <button id="canvasSettingsApply" type="button">適用</button>
      </div>
    </dialog>

    <dialog id="globalSettingsDialog" class="appDialog">
      <div class="dialogHead">
        <h2>グローバル設定</h2>
        <button id="globalSettingsClose" type="button" class="dialogCloseBtn" title="閉じる" aria-label="閉じる">×</button>
      </div>

      <p class="dialogHint">ここでの設定はすべてのブラシ・消しゴムに共通で適用されます（ブラシごとには保存されません）。</p>

      <label class="control" id="pressureEnabledRow">
        <input id="pressureEnabledInput" type="checkbox" checked />
        <span>筆圧を有効にする</span>
      </label>

      <label class="control vertical">
        <span>手ブレ補正</span>
        <div class="controlRow">
          <input id="stabilizer" type="range" min="0" max="95" value="0" />
          <span id="stabilizerValue" class="mono">0</span>
        </div>
      </label>

      <label class="control vertical">
        <span>筆圧補正</span>
        <div class="controlRow">
          <input id="pressureSmoothing" type="range" min="0" max="95" value="0" />
          <span id="pressureSmoothingValue" class="mono">0</span>
        </div>
      </label>

      <label class="control vertical">
        <span>ツール切り替えの長押し確定時間（これより短い入力はそのツールに完全に切り替わります）</span>
        <div class="controlRow">
          <input id="globalHoldThreshold" type="range" min="100" max="1000" step="50" value="350" />
          <span id="globalHoldThresholdValue" class="mono">350ms</span>
        </div>
      </label>

      <div class="brushPanelSectionTitle">ショートカット</div>

      <div id="shortcutRows" class="shortcutRows"></div>

      <div class="dialogFooter">
        <button id="shortcutsResetDefault" type="button">デフォルトに戻す</button>
        <button id="shortcutsSave" type="button">保存</button>
      </div>
    </dialog>

    <script src="./vendor/draw-engine.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
